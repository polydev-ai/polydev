# Publishes server.json to the MCP Registry (io.github.polydev-ai/polydev).
# Run it by hand (Actions -> Publish to MCP Registry -> Run workflow) after each npm release.
# The registry checks org ownership through GitHub's OIDC token, so no secret is needed.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mcp-publisher 1.8.6
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher --version
      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Publish server.json
        run: ./mcp-publisher publish
